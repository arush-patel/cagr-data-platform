[project]
name = "cagr-data-platform"
version = "0.1.0"
description = "Cagr data platform: market data feeds, reference data, clean bars, quality checks and the parquet lake."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
flows = ["prefect>=3.0"]

[project.scripts]
cagr = "cagr_data.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cagr_data"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter wraps code; long lines left are SQL strings, which read better unbroken.
# B008: typer declares options as call defaults.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
exclude = ["src/cagr_data/flows/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the Docker Postgres (docker compose up -d db)"]
