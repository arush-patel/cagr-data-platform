[project]
name = "cagr-data-platform"
version = "0.0.0"
description = "Workspace root for the Cagr monorepo"
requires-python = ">=3.12"
dependencies = ["cagr-data", "cagr-toolkit"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["platform", "toolkit"]

[tool.uv.sources]
cagr-data = { workspace = true }
cagr-toolkit = { workspace = true }

[dependency-groups]
dev = [
    "dagster-webserver>=1.9",
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cagr_data", "cagr"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["cagr_data", "cagr"]
mypy_path = "platform/src:toolkit/src"

[[tool.mypy.overrides]]
module = ["yoyo", "yoyo.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["platform/tests", "toolkit/tests"]
markers = ["db: needs a Postgres database at CAGR_TEST_DATABASE_URL"]
