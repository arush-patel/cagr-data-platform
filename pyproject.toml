[project]
name = "cagr-data-platform"
version = "0.0.0"
description = "Workspace root for the Cagr monorepo"
requires-python = ">=3.12"
dependencies = ["cagr-data"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["platform"]

[tool.uv.sources]
cagr-data = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cagr_data"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["cagr_data"]
mypy_path = "platform/src"

[tool.pytest.ini_options]
testpaths = ["platform/tests"]
markers = ["db: needs a Postgres database at CAGR_TEST_DATABASE_URL"]
