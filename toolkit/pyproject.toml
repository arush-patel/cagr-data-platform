[project]
name = "cagr-toolkit"
version = "0.1.0"
description = "The Cagr shared library: indicators, metrics, features, splits and point-in-time reads"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "xlsxwriter>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cagr"]
