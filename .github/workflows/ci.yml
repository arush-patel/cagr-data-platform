name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cagr
          POSTGRES_PASSWORD: cagr
          POSTGRES_DB: cagr_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U cagr -d cagr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: "3.12"
      CAGR_TEST_DATABASE_URL: postgresql://cagr:cagr@localhost:54329/cagr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -ra
