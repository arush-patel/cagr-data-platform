[project]
name = "cagr-data"
version = "0.1.0"
description = "The Cagr data platform: vendor feeds, reference data, clean bars and checks"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "yoyo-migrations>=9.0",
    "polars>=1.20",
    "httpx>=0.28",
    "tenacity>=9.0",
    "dagster>=1.9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cagr_data"]
